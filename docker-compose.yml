services:
  mysql:
    image: mariadb:10.6
    container_name: familiez-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: ${DB_NAME:-humans}
      MYSQL_USER: ${DB_USER:-CHANGE_ME}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BE/init:/docker-entrypoint-initdb.d  # SQL init scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - familiez-network

  mw:
    build: ./MW
    container_name: familiez-mw
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
      STORAGE_BASE_PATH: /app/BESTANDEN  # File storage inside container
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.89:5173"
      SYNOLOGY_OIDC_DISCOVERY_URL: https://sso.dekknet.com/webman/sso/.well-known/openid-configuration
      SYNOLOGY_CLIENT_ID: ${SYNOLOGY_CLIENT_ID}
      SYNOLOGY_CLIENT_SECRET: ${SYNOLOGY_CLIENT_SECRET}
      SYNOLOGY_OIDC_VERIFY_SSL: "false"
      SYNOLOGY_JWT_LEEWAY: ${SYNOLOGY_JWT_LEEWAY:-120}
      SYNOLOGY_REDIRECT_URI: ${SYNOLOGY_REDIRECT_URI}
      SYNOLOGY_LDAP_URL: ${SYNOLOGY_LDAP_URL}
      SYNOLOGY_LDAP_BIND_DN: ${SYNOLOGY_LDAP_BIND_DN}
      SYNOLOGY_LDAP_BIND_PASSWORD: ${SYNOLOGY_LDAP_BIND_PASSWORD}
      SYNOLOGY_LDAP_GROUP_ADMIN_DN: ${SYNOLOGY_LDAP_GROUP_ADMIN_DN}
      SYNOLOGY_LDAP_GROUP_USER_DN: ${SYNOLOGY_LDAP_GROUP_USER_DN}
      SYNOLOGY_LDAP_MEMBER_DN_TEMPLATE: ${SYNOLOGY_LDAP_MEMBER_DN_TEMPLATE}
      SYNOLOGY_LDAPTLS_REQCERT: ${SYNOLOGY_LDAPTLS_REQCERT}
      SYNOLOGY_LDAP_TIMEOUT: ${SYNOLOGY_LDAP_TIMEOUT}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./MW:/app  # Hot reload in development
      - ./BESTANDEN:/app/BESTANDEN  # File storage mount
    networks:
      - familiez-network

  fe:
    build:
      context: ./FE
      dockerfile: dockerfile.dev
    container_name: familiez-fe
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_SYNOLOGY_AUTH_URL: ${VITE_SYNOLOGY_AUTH_URL}
      VITE_CLIENT_ID: ${SYNOLOGY_CLIENT_ID}
      VITE_REDIRECT_URI: ${SYNOLOGY_REDIRECT_URI}
      VITE_SYNOLOGY_DISCOVERY_URL: ${VITE_SYNOLOGY_DISCOVERY_URL}
      VITE_API_BASE: ${VITE_API_BASE}
    depends_on:
      - mw
    volumes:
      - ./FE:/app
      - /app/node_modules
    networks:
      - familiez-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: familiez-portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - familiez-network

volumes:
  mysql_data:
  portainer_data:

networks:
  familiez-network:
    driver: bridge
