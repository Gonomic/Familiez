services:
  mysql:
    image: mariadb:10.6
    container_name: familiez-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: ${DB_NAME:-humans}
      MYSQL_USER: ${DB_USER:-CHANGE_ME}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BE/init:/docker-entrypoint-initdb.d  # SQL init scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - familiez-network

  mw:
    build: ./MW
    container_name: familiez-mw
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-HumansService}:${DB_PASSWORD:-${DB_PASSWORD}}@mysql:3306/${DB_NAME:-humans}
      SYNOLOGY_OIDC_DISCOVERY_URL: https://sso.dekknet.com/webman/sso/.well-known/openid-configuration
      SYNOLOGY_CLIENT_ID: familiez-local-dev
      SYNOLOGY_OIDC_VERIFY_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./MW:/app  # Hot reload in development
    networks:
      - familiez-network

  fe:
    build:
      context: ./FE
      dockerfile: dockerfile.dev
    container_name: familiez-fe
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_SYNOLOGY_AUTH_URL: https://sso.dekknet.com
      VITE_CLIENT_ID: familiez-local-dev
      VITE_REDIRECT_URI: http://sso.dekknet.com:5173/auth/callback
      VITE_SYNOLOGY_DISCOVERY_URL: https://sso.dekknet.com/webman/sso/.well-known/openid-configuration
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - mw
    volumes:
      - ./FE:/app
      - /app/node_modules
    networks:
      - familiez-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: familiez-portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - familiez-network

volumes:
  mysql_data:
  portainer_data:

networks:
  familiez-network:
    driver: bridge
